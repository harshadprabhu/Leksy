# Local development stack: databases plus the three Leksy services.
#   docker compose up -d postgres redis mailpit   # just the dependencies
#   docker compose up --build                      # everything
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: leksy, POSTGRES_PASSWORD: leksy, POSTGRES_DB: leksy }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "leksy"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]
  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://leksy:leksy@postgres:5432/leksy
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: { context: ., dockerfile: infra/docker/worker.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://leksy:leksy@postgres:5432/leksy
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
    depends_on: [api]
  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile, args: { NEXT_PUBLIC_API_URL: "http://localhost:4000" } }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata: {}
